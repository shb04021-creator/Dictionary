<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하이큐 픽셀 백과</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4e6;--panel:#ffffff;--ink:#1a1a1a;--muted:#6b5a4a;--accent:#f28c28;--accent2:#1a1a1a;--line:#1a1a1a;--shadow:#1a1a1a;--chip:#ffe0bf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--panel:#1e1e1e;--ink:#f5f0e8;--muted:#b8a898;--accent:#f28c28;--accent2:#f28c28;--line:#f28c28;--shadow:#000;--chip:#3a2a1a}}
:root[data-theme="dark"]{--bg:#121212;--panel:#1e1e1e;--ink:#f5f0e8;--muted:#b8a898;--accent:#f28c28;--accent2:#f28c28;--line:#f28c28;--shadow:#000;--chip:#3a2a1a}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:'DotGothic16',monospace;line-height:1.6}
.px{font-family:'Press Start 2P',monospace}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.box{background:var(--panel);border:4px solid var(--line);box-shadow:6px 6px 0 var(--shadow)}
header{background:var(--accent);border-bottom:6px solid #1a1a1a;padding:24px 0;color:#1a1a1a}
.banner{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.banner svg{width:72px;height:72px;image-rendering:pixelated;flex:none}
.banner h1{margin:0;font-family:'Press Start 2P';font-size:clamp(16px,4vw,30px);text-shadow:3px 3px 0 #fff}
.banner p{margin:4px 0 0}
.tbtn{margin-left:auto;display:flex;gap:8px}
button{font-family:inherit;font-size:14px;cursor:pointer;color:var(--ink);background:var(--panel);border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);padding:6px 10px}
button:active{transform:translate(3px,3px);box-shadow:none}
button.on{background:var(--accent);color:#1a1a1a}
header button{background:#fff;color:#1a1a1a;border-color:#1a1a1a;box-shadow:3px 3px 0 #1a1a1a}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 12px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
input,select{font-family:inherit;font-size:15px;padding:6px 10px;border:3px solid var(--line);background:var(--panel);color:var(--ink);min-width:0}
input{flex:1 1 220px}
.teaminfo{padding:16px;margin-bottom:20px;border-left-width:16px}
.teaminfo h2{margin:0 0 6px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-bottom:40px}
.card{padding:10px;cursor:pointer;text-align:center;border-top-width:10px;transition:transform .1s}
.card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--shadow)}
.card canvas{width:96px;height:96px;image-rendering:pixelated;background:var(--chip);border:3px solid var(--line)}
.card .num{font-family:'Press Start 2P';font-size:11px;color:var(--accent)}
.card .nm{font-size:16px;margin:2px 0}
.chip{display:inline-block;background:var(--chip);border:2px solid var(--line);padding:0 6px;font-size:12px}
.count{color:var(--muted);margin-bottom:8px}
dialog{border:none;padding:0;background:transparent;max-width:min(760px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(0,0,0,.7)}
.modal{padding:20px;max-height:88vh;overflow:auto}
.mtop{display:flex;gap:20px;flex-wrap:wrap}
.mtop canvas{width:192px;height:192px;image-rendering:pixelated;background:var(--chip);border:4px solid var(--line);flex:none}
.mtop .info{flex:1 1 260px;min-width:0}
.mtop h2{margin:0;font-size:24px}
table{border-collapse:collapse;width:100%;margin-top:8px}
td{border:2px solid var(--line);padding:3px 8px;font-size:14px}
td:first-child{background:var(--chip);width:90px}
h3{font-family:'Press Start 2P';font-size:12px;margin:18px 0 8px;color:var(--accent)}
.stat{display:grid;grid-template-columns:70px 1fr 20px;gap:8px;align-items:center;margin:4px 0}
.bar{display:flex;gap:3px}
.bar i{flex:1;height:14px;border:2px solid var(--line);background:transparent}
.bar i.f{background:var(--accent)}
.hex{display:block;margin:0 auto;width:220px;height:200px;image-rendering:pixelated}
.statwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.statwrap>div{flex:1 1 240px}
blockquote{margin:0;padding:10px 14px;border:3px dashed var(--accent);font-size:17px}
.close{float:right}
footer{text-align:center;color:var(--muted);padding:20px 0 40px;font-size:13px}
</style>
</head>

<script>
(function(){
const TEAMS=(window.HQ||[]);
const ALL=[];TEAMS.forEach(t=>(t.chars||[]).forEach(c=>ALL.push(Object.assign({},c,{_t:t}))));
const STATS=[['power','파워'],['jump','점프'],['stamina','체력'],['strategy','두뇌'],['technique','기술'],['speed','스피드']];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let team='all',pos='all',q='';

function drawSprite(cv,sp){
  const rows=(sp&&sp.rows)||[];const pal=(sp&&sp.palette)||{};
  const h=rows.length||16,w=rows.reduce((a,r)=>Math.max(a,r.length),0)||16;
  cv.width=w;cv.height=h;const x=cv.getContext('2d');x.clearRect(0,0,w,h);
  rows.forEach((r,y)=>{for(let i=0;i<r.length;i++){const col=pal[r[i]];if(col&&col!=='transparent'){x.fillStyle=col;x.fillRect(i,y,1,1);}}});
}
function sprite(c,cls){const cv=document.createElement('canvas');if(cls)cv.className=cls;drawSprite(cv,c.sprite);return cv;}

// tabs
const tabs=$('tabs');
function mkTab(id,label){const b=document.createElement('button');b.textContent=label;b.dataset.id=id;b.onclick=()=>{team=id;render();};tabs.appendChild(b);}
mkTab('all','전체');TEAMS.forEach(t=>mkTab(t.id,t.team));
// positions
const ps=[...new Set(ALL.map(c=>c.position).filter(Boolean))];
$('pos').innerHTML='<option value="all">모든 포지션</option>'+ps.map(p=>`<option>${esc(p)}</option>`).join('');
$('pos').onchange=e=>{pos=e.target.value;render();};
$('q').oninput=e=>{q=e.target.value.trim().toLowerCase();render();};

function render(){
  [...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.id===team));
  const ti=$('teaminfo');
  if(team==='all'){
    ti.innerHTML=`<div class="box teaminfo" style="border-left-color:var(--accent)"><h2>전체 팀 · ${TEAMS.length}개</h2><p style="margin:0">${TEAMS.map(t=>`<span class="chip" style="border-left:8px solid ${esc(t.colors&&t.colors.sub)}">${esc(t.team)} ${t.chars.length}</span>`).join(' ')}</p></div>`;
  }else{
    const t=TEAMS.find(x=>x.id===team);const c=t.colors||{};
    ti.innerHTML=`<div class="box teaminfo" style="border-left-color:${esc(c.sub||c.main)}"><h2>${esc(t.team)}</h2><p style="margin:0">${esc(t.motto||t.intro||'')}</p><p style="margin:6px 0 0;color:var(--muted)">등록 인원 ${t.chars.length}명 · 팀컬러 <span class="chip" style="background:${esc(c.main)};width:20px">&nbsp;</span> <span class="chip" style="background:${esc(c.sub)};width:20px">&nbsp;</span></p></div>`;
  }
  const list=ALL.filter(c=>(team==='all'||c._t.id===team)&&(pos==='all'||c.position===pos)&&(!q||[c.name,c.jp,c.position,c.nickname].join(' ').toLowerCase().includes(q)));
  $('count').textContent=`${list.length}명 표시 중`;
  const g=$('grid');g.innerHTML='';
  if(!list.length){g.innerHTML='<p>검색 결과가 없습니다.</p>';return;}
  list.forEach(c=>{
    const d=document.createElement('div');d.className='box card';d.tabIndex=0;d.setAttribute('role','button');
    d.style.borderTopColor=(c._t.colors&&c._t.colors.sub)||'var(--accent)';
    d.appendChild(sprite(c));
    d.insertAdjacentHTML('beforeend',`<div class="num">${c.number?'#'+esc(c.number):'—'}</div><div class="nm">${esc(c.name)}</div><span class="chip">${esc(c.position)}</span><div style="font-size:12px;color:var(--muted)">${esc(c._t.team)}</div>`);
    d.onclick=()=>open(c);d.onkeydown=e=>{if(e.key==='Enter')open(c);};
    g.appendChild(d);
  });
}

function hexSvg(s){
  const cx=110,cy=100,R=80,pt=(i,r)=>{const a=-Math.PI/2+i*Math.PI/3;return [Math.round(cx+r*Math.cos(a)),Math.round(cy+r*Math.sin(a))];};
  let o=`<svg class="hex" viewBox="0 0 220 200" shape-rendering="crispEdges">`;
  for(let l=1;l<=5;l++)o+=`<polygon points="${[0,1,2,3,4,5].map(i=>pt(i,R*l/5).join(',')).join(' ')}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4"/>`;
  o+=`<polygon points="${STATS.map(([k],i)=>pt(i,R*(Math.max(0,Math.min(5,s[k]||0)))/5).join(',')).join(' ')}" fill="var(--accent)" fill-opacity=".55" stroke="var(--accent)" stroke-width="4"/>`;
  STATS.forEach(([k,l],i)=>{const[x,y]=pt(i,R*(s[k]||0)/5);o+=`<rect x="${x-4}" y="${y-4}" width="8" height="8" fill="var(--ink)"/>`;const[tx,ty]=pt(i,R+14);o+=`<text x="${tx}" y="${ty+4}" text-anchor="middle" font-size="12" fill="var(--ink)" font-family="DotGothic16">${l}</text>`;});
  return o+'</svg>';
}
function open(c){
  const s=c.stats||{},t=c._t;
  const rows=[['팀',t.team],['포지션',c.position],['등번호',c.number||'—'],['학년',c.grade],['신장',c.height],['생일',c.birthday],['별명',c.nickname],['일본명',c.jp],['성우',c.voice]];
  $('mbody').innerHTML=`<button class="close" id="cls" aria-label="닫기">X</button>
  <div class="mtop"><div id="big"></div><div class="info"><div class="px" style="font-size:12px;color:var(--accent)">${c.number?'#'+esc(c.number):''}</div><h2>${esc(c.name)}</h2>
  <table>${rows.filter(r=>r[1]).map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join('')}</table></div></div>
  <h3>STATUS</h3><div class="statwrap">${hexSvg(s)}<div>${STATS.map(([k,l])=>`<div class="stat"><span>${l}</span><div class="bar">${[1,2,3,4,5].map(n=>`<i class="${n<=(s[k]||0)?'f':''}"></i>`).join('')}</div><span class="px" style="font-size:10px">${s[k]||0}</span></div>`).join('')}</div></div>
  <h3>SKILLS</h3><div>${(c.skills||[]).map(k=>`<span class="chip" style="margin:2px">${esc(k)}</span>`).join(' ')||'—'}</div>
  <h3>QUOTE</h3><blockquote>“${esc(c.quote||'…')}”</blockquote>
  <h3>PROFILE</h3><p style="margin:0">${esc(c.intro)}</p>`;
  $('big').appendChild(sprite(c));
  $('cls').onclick=()=>$('dlg').close();
  $('dlg').showModal();$('mbody').scrollTop=0;
}
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close();});
$('rand').onclick=()=>{if(ALL.length)open(ALL[Math.floor(Math.random()*ALL.length)]);};
$('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('hq-theme',r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem('hq-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
render();
})();
</script>
